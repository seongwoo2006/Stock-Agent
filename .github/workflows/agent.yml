name: Stock Agent Automation

on:
  schedule:
    # 캘리포니아 아침 7시(14시 UTC), 오후 1시(20시 UTC), 저녁 7시(02시 UTC)
    - cron: '0 2,14,20 * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: pip install yfinance ta pandas

      - name: 에이전트 실행
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: python main.py
