name: Stock Agent Automation

on:
  schedule:
    # 매시간 0분에 자동으로 실행 (24시간 무한 감시)
    - cron: '0 * * * *'
  workflow_dispatch: # 수동 실행 버튼 생성

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 불러오기
        uses: actions/checkout@v3

      - name: 파이썬 설치
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: pip install yfinance ta

      - name: 에이전트 실행
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: python main.py
